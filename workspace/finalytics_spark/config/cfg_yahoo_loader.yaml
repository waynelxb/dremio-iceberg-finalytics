assignments:
  load_yahoo_etf_eod_quotes_to_iceberg:
    # Job parameters for the LoadYahooEOD class
    parameters:
      conn_config_file: /opt/workspace/finalytics_spark/config/cfg_conn.yaml
      conn_config_pgdb_uri_key: ['databases', 'finalytics', 'connection_uri']
      conn_config_pgdb_params_key: ['databases', 'finalytics']

      schema_config_file: /opt/workspace/finalytics_spark/config/cfg_schemas.yaml
      schema_config_iceberg_raw_table_key: ["tables","nessie.raw.etf_eod_yahoo"]
      
      spark_app_name: finalytics_spark # Name of the Spark application
      conn_config_spark_key: ['spark'] 


      # equity_type: etf # Type of equity (e.g., "etf", "stock") 
      record_type: eod_quote
      
      grouped_symbol_query: |
        SELECT group_id, group_start_date, symbol
        FROM fin.ufn_etl_get_grouped_etf_eod_start_date(5)
        WHERE group_id <=1

      pg_stage_table_name: stage.etf_eod_quote_yahoo
      pg_merge_stage_into_fin_script: call fin.usp_load_etf_eod_quote()
